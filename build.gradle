plugins {
    id 'java'
    id 'gg.essential.loom' version '1.15.50'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'net.toshimichi'
version = '1.0'
base.archivesName = 'recorder'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

configurations {
    shade
    implementation.extendsFrom shade
}

loom {
    runs {
        client {
            property 'fml.coreMods.load', 'net.toshimichi.recorder.MixinLoaderPlugin'
        }
    }
    forge {
        pack200Provider = new dev.architectury.pack200.java.Pack200Adapter()
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'mixins.recorder.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://repo.essential.gg/repository/maven-public' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'

    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        transitive = false
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT'
    annotationProcessor 'org.ow2.asm:asm-tree:9.6'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor 'com.google.guava:guava:31.1-jre'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.8.9'
    }
}

jar {
    manifest.attributes(
            'FMLCorePlugin': 'net.toshimichi.recorder.MixinLoaderPlugin',
            'ForceLoadAsMod': 'true',
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'MixinConfigs': 'mixins.recorder.json'
    )
}

shadowJar {
    archiveClassifier = 'dev'
    configurations = [project.configurations.shade]

    exclude 'META-INF/maven/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

remapJar {
    inputFile = shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = ''
}

tasks.named('assemble') {
    dependsOn tasks.named('remapJar')
}
